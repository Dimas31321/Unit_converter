<html>
<head>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <script href="index.js"></script>
    <p id="title">Metric/Imperial Unit Conversion</p>
    <input id="input-number">
    <button id="convert-btn">Convert</button>
    <div id="info">
        <div id="length">
            <p class="category">Length (Meter/Feet)</p>
            <p class="supporting-text">20 meters = 65.616 feet | 20 feet = 6.096 meters</p>
        </div>
        <div id="volume">
            <p class="category">Volume (Liters/Gallons)</p>
            <p class="supporting-text">20 liters = 5.284 gallons | 20 gallons = 75.708 liters</p>
        </div>
        <div id="mass">
            <p class="category">Mass (Kilograms/Pounds)</p>
            <p class="supporting-text">20 kilos = 44.092 pounds | 20 pounds = 9.072 kilos</p>
        </div>
    </div>
</body>
</html>
